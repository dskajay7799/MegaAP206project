services:

* type: web
  name: verity-api
  runtime: python

  buildCommand: pip install -r requirements.txt && python scripts/build_demo_store.py && ALLOW_DEV_DATA=1 python -m backend.manage migrate

  startCommand: gunicorn backend.app.main:app --workers 2 --bind 0.0.0.0:$PORT --timeout 120

  envVars:

  * key: APP_ENV
    value: production

  * key: ALLOW_DEV_DATA
    value: "1"

  * key: SEED_DEMO
    value: "1"

  * key: AUTO_MIGRATE
    value: "1"

  * key: COOKIE_SECURE
    value: "1"

  * key: COOKIE_SAMESITE
    value: "None"

  * key: SECRET_KEY
    generateValue: true

  * key: DATABASE_URL
    sync: false

  * key: GROQ_API_KEY
    sync: false

  * key: GROQ_MODEL
    value: llama-3.1-8b-instant

  * key: DEMO_PASSWORD
    sync: false

  * key: ADMIN_EMAIL
    sync: false

  * key: ADMIN_PASSWORD
    sync: false

  * key: CORS_ORIGINS
    sync: false
